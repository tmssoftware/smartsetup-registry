# =====================================================================================================
# TMS Smart Setup configuration file for product HashLib4Pascal
# See https://doc.tmssoftware.com/smartsetup/guide/creating-bundles.html#creating-a-tmsbuildyaml-file
# =====================================================================================================
# yaml-language-server: $schema=https://raw.githubusercontent.com/tmssoftware/smartsetup/refs/heads/main/tms/example-config/tmsbuild.schema.json

minimum required tmsbuild version: 3.5

# General information about the product.
application:
  id: xor-el.hash-lib-4-pascal
  name: HashLib4Pascal
  description: Object Pascal library for hashing algorithms.
  url: https://github.com/Xor-el/HashLib4Pascal.git

# Frameworks are just a group of supported IDEs and platforms. You can define as much as you want with any name you desire, and then combine them to specify what platforms and IDEs the packages support.
supported frameworks:
  rtl:
    ide since: delphi2010
    platforms:
      - win32intel
      - win64intel
      - macos64intel
      - macos64arm
      - iosdevice64
      - android32
      - android64
      - iossimulator64arm
      - winarm64ec

packages:
  - HashLib4PascalPackage: [rtl]

package definitions:
  HashLib4PascalPackage:
    generate from: HashLib\src\Packages\Delphi\HashLib4PascalPackage.dpk
    framework type: NONE # can be NONE, FMX or VCL
    description: Object Pascal library for hashing algorithms.


